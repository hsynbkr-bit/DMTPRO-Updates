name: DMTPRO 2.0.2 stable update smoke - Windows QA and release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore pinned licensed DMTPRO 2.0 beta.2
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          New-Item -ItemType Directory -Force dist/original | Out-Null
          $setup=Join-Path $PWD 'dist/original/previous.exe'
          Invoke-WebRequest 'https://github.com/hsynbkr-bit/DMTPRO-Updates/releases/download/dmtpro-v2.0.0-beta.2/DMTPRO_Setup_2.0.0_IconFix_win_x64.exe' -OutFile $setup -TimeoutSec 240
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'dfe73e36bc7ac1c8e17d713ee6477a4d2a5cd9e7ccff8dec63cbe5fd0373ac88') { throw 'Untrusted source setup' }
          & 'C:\Program Files\7-Zip\7z.exe' x -y '-odist/original' $setup | Out-Null
          foreach ($name in @('DMTPRO.exe','DMTPRO_Icon.ico','support-config.json')) {
            if (!(Test-Path "dist/original/$name")) { throw "Base setup missing $name" }
          }
          $engine=(Get-FileHash 'dist/original/DMTPRO.exe' -Algorithm SHA256).Hash.ToLower()
          if ($engine -ne '3526b11318f93d7adf82ad9a255410fc07fcb11dcf6e343dc31f48f5cabbe9a1') { throw 'Original engine mismatch' }

      - name: Compile self-contained Windows launcher
        shell: pwsh
        run: |
          dotnet publish updater/DMTPROLauncher.csproj -c Release -r win-x64 --self-contained true -o dist/updater
          if ($LASTEXITCODE -ne 0 -or !(Test-Path dist/updater/DMTPROLauncher.exe)) { throw 'Compilation failed' }

      - name: Run update, digest, rollback and version unit tests
        shell: pwsh
        run: |
          $report=Join-Path $env:RUNNER_TEMP 'updater-test.json'
          $p=Start-Process (Resolve-Path dist/updater/DMTPROLauncher.exe) -ArgumentList @('--self-test',$report) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Updater selftest failed: $(Get-Content -Raw $report)" }
          $test=Get-Content -Raw $report | ConvertFrom-Json
          if (!$test.checksum_rejection -or !$test.rollback -or !$test.apply -or !$test.stable_2x_filter) { throw 'Selftest results invalid' }
          Write-Host "UPDATER_TEST_PASS: $(Get-Content -Raw $report)"

      - name: Create update ZIP with per-file SHA-256 manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          '2.0.2' | Set-Content -Path dist/version.txt -Encoding ascii -NoNewline
          foreach ($name in @('DMTPRO.exe','DMTPRO_Icon.ico')) { Copy-Item "dist/original/$name" "dist/package/$name" }
          Copy-Item dist/updater/DMTPROLauncher.exe dist/package/DMTPROLauncher.exe
          Copy-Item dist/version.txt dist/package/version.txt
          $files=[ordered]@{}
          foreach ($name in @('DMTPRO.exe','DMTPROLauncher.exe','DMTPRO_Icon.ico','version.txt')) {
            $files[$name]=(Get-FileHash "dist/package/$name" -Algorithm SHA256).Hash.ToLower()
          }
          $manifest=[ordered]@{version='2.0.2';releaseTag='dmtpro-v2.0.2';files=$files}
          $manifest | ConvertTo-Json -Depth 5 | Set-Content dist/package/version.json -Encoding utf8
          Compress-Archive -Path dist/package/* -DestinationPath dist/DMTPRO_update_win_x64.zip -CompressionLevel Optimal

      - name: Verify existing 2.0.1 installation can apply the 2.0.2 payload
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $testdir=Join-Path $env:RUNNER_TEMP 'DMTPRO-2.0.1-to-2.0.2'
          $payload=Join-Path $testdir 'payload'
          New-Item -ItemType Directory -Force -Path $testdir,$payload | Out-Null
          $oldSetup=Join-Path $testdir '2.0.1-setup.exe'
          Invoke-WebRequest 'https://github.com/hsynbkr-bit/DMTPRO-Updates/releases/download/dmtpro-v2.0.1-beta.1/DMTPRO_Setup_2.0.1_win_x64.exe' -OutFile $oldSetup -TimeoutSec 240
          if ((Get-FileHash $oldSetup -Algorithm SHA256).Hash.ToLower() -ne '68db0c43625a0ac4c74727674f7b6c01a9c5262a2324c05d831fbd65d06e4054') { throw '2.0.1 base setup altered' }
          $base=Start-Process -FilePath $oldSetup -ArgumentList '/S' -Wait -PassThru
          if ($base.ExitCode -ne 0) { throw '2.0.1 base setup failed' }
          $dir=Join-Path $env:LOCALAPPDATA 'Programs\DMTPRO'
          if ((Get-Content -Raw (Join-Path $dir 'version.txt')).Trim() -ne '2.0.1') { throw 'Base installation must start at 2.0.1' }
          Copy-Item (Join-Path $dir 'DMTPROLauncher.exe') (Join-Path $testdir 'DMTPROUpdateWorker.exe')
          Expand-Archive -Path dist/DMTPRO_update_win_x64.zip -DestinationPath $payload
          $manifest=Get-Content (Join-Path $payload 'version.json') -Raw | ConvertFrom-Json
          if ($manifest.version -ne '2.0.2' -or $manifest.releaseTag -ne 'dmtpro-v2.0.2') { throw 'Invalid version/release tag in ZIP' }
          foreach ($name in @('DMTPRO.exe','DMTPROLauncher.exe','DMTPRO_Icon.ico','version.txt')) {
            if ((Get-FileHash (Join-Path $payload $name) -Algorithm SHA256).Hash.ToLower() -ne $manifest.files.$name) { throw "Payload hash mismatch: $name" }
          }
          $apply=Start-Process -FilePath (Join-Path $testdir 'DMTPROUpdateWorker.exe') -ArgumentList @('--apply',$testdir,$dir,'9999999') -PassThru
          # WaitForExit waits only for the worker, not its deliberately launched DMTPRO desktop child.
          if (!$apply.WaitForExit(45000)) { Stop-Process -Id $apply.Id -Force -ErrorAction SilentlyContinue; throw 'Updater worker timed out' }
          if ($apply.ExitCode -ne 0) { throw "2.0.1 worker could not apply 2.0.2 ($($apply.ExitCode))" }
          if (!(Test-Path (Join-Path $testdir 'started.ok'))) { throw 'New program launch was not confirmed' }
          if ((Get-Content -Raw (Join-Path $dir 'version.txt')).Trim() -ne '2.0.2') { throw '2.0.2 version.txt not installed' }
          if ((Get-FileHash (Join-Path $dir 'DMTPROLauncher.exe') -Algorithm SHA256).Hash.ToLower() -ne (Get-FileHash dist/updater/DMTPROLauncher.exe -Algorithm SHA256).Hash.ToLower()) { throw 'New 2.0.2 launcher is not active' }
          if ((Get-FileHash (Join-Path $dir 'DMTPRO.exe') -Algorithm SHA256).Hash.ToLower() -ne '3526b11318f93d7adf82ad9a255410fc07fcb11dcf6e343dc31f48f5cabbe9a1') { throw 'Licensed app engine changed during upgrade' }
          Get-Process -Name 'DMTPRO' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'LOCAL_REAL_UPGRADE_2.0.1_TO_2.0.2_PASS'

      - name: Build single-file setup
        shell: pwsh
        run: |
          $nsis='C:\Program Files (x86)\NSIS\makensis.exe'
          if (!(Test-Path $nsis)) { choco install nsis --no-progress --yes --limit-output }
          if (!(Test-Path $nsis)) { throw 'NSIS missing' }
          $dist=(Resolve-Path dist).Path
          foreach ($required in @('original/DMTPRO.exe','updater/DMTPROLauncher.exe','original/DMTPRO_Icon.ico','version.txt')) {
            if (!(Test-Path (Join-Path $dist $required))) { throw "Missing NSIS input: $required" }
          }
          (Get-Content -Raw scripts/installer_2.0.2.nsi).Replace('@DIST@', $dist) | Set-Content dist/generated-installer.nsi -Encoding utf8
          & $nsis /V2 /NOCD dist/generated-installer.nsi
          if ($LASTEXITCODE -ne 0 -or !(Test-Path dist/DMTPRO_Setup_2.0.2_win_x64.exe)) { throw 'NSIS failed' }

      - name: Verify silent install, launcher shortcut and application startup
        shell: pwsh
        run: |
          $p=Start-Process (Resolve-Path dist/DMTPRO_Setup_2.0.2_win_x64.exe) -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Setup installation failed' }
          $dir=Join-Path $env:LOCALAPPDATA 'Programs\DMTPRO'
          foreach ($name in @('DMTPRO.exe','DMTPROLauncher.exe','DMTPRO_Icon.ico','support-config.json','version.txt','Uninstall.exe')) {
            if (!(Test-Path (Join-Path $dir $name))) { throw "Missing $name" }
          }
          if ((Get-Content -Raw (Join-Path $dir version.txt)).Trim() -ne '2.0.2') { throw 'Wrong installed version' }
          if ((Get-FileHash (Join-Path $dir DMTPRO.exe) -Algorithm SHA256).Hash.ToLower() -ne '3526b11318f93d7adf82ad9a255410fc07fcb11dcf6e343dc31f48f5cabbe9a1') { throw 'App engine modified' }
          $shortcut=Join-Path ([Environment]::GetFolderPath('Desktop')) 'DMTPRO.lnk'
          $sc=(New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
          if ($sc.TargetPath -ne (Join-Path $dir DMTPROLauncher.exe)) { throw "Updater shortcut is wrong: $($sc.TargetPath)" }
          $launch=Start-Process (Join-Path $dir DMTPROLauncher.exe) -PassThru
          Start-Sleep -Seconds 18
          $app=Get-Process -Name DMTPRO -ErrorAction SilentlyContinue
          if (!$app) { throw 'App not running after launcher' }
          $app | Stop-Process -Force -ErrorAction SilentlyContinue
          if (!$launch.HasExited) { Stop-Process -Id $launch.Id -Force -ErrorAction SilentlyContinue }
          Write-Host 'WINDOWS_SETUP_AND_LAUNCH_PASS'
          $removed=Start-Process (Join-Path $dir Uninstall.exe) -ArgumentList '/S' -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw 'Uninstaller failed' }

      - name: Retain Windows-tested release packages
        uses: actions/upload-artifact@v4
        with:
          name: dmtpro-2.0.2-updater-tested
          path: |
            dist/DMTPRO_Setup_2.0.2_win_x64.exe
            dist/DMTPRO_update_win_x64.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dmtpro-2.0.2-updater-tested
          path: download
      - name: Publish Windows-tested stable release only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=dmtpro-v2.0.2
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release tag already exists; refusing overwrite'
            exit 1
          fi
          setup=download/DMTPRO_Setup_2.0.2_win_x64.exe
          zip=download/DMTPRO_update_win_x64.zip
          setup_hash=$(sha256sum "$setup" | cut -d' ' -f1)
          zip_hash=$(sha256sum "$zip" | cut -d' ' -f1)
          cat > notes.md <<EOF
          DMTPRO 2.0.2: stable automatic-update smoke test build.
          - Standalone Setup; installed desktop icon opens the updater first.
          - Detects the latest tested 2.x non-prerelease via GitHub.
          - Shows a confirmation, checks ZIP and file SHA-256, then updates and rolls back if launch fails.
          - Licensed DMTPRO engine is unchanged from beta.2.
          - Existing beta users must install this Setup once to activate future updates.
          - Version 2.0.2 updates launcher and version manifest only; original 2.0 metraj/licensing engine stays bit-for-bit unchanged.
          - Real AutoCAD/DWG end-to-end production verification remains open.
          Setup SHA-256: $setup_hash
          Update ZIP SHA-256: $zip_hash
          EOF
          gh release create "$tag" "$setup" "$zip" \
            --repo "$GITHUB_REPOSITORY" --target main \
            --title 'DMTPRO 2.0.2 stable - Otomatik guncelleme testi' --notes-file notes.md
