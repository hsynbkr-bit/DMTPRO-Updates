name: DMTPRO Windows Authenticode identity audit

on:
  push:
    branches: [audit/2.0.3-windows-signature-reputation]
    paths: [".github/workflows/audit-dmtpro-signatures.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-release-authenticode:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Verify published DMTPRO 2.0.3 hashes and inspect signatures (read only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'dmtpro-203-authenticode-audit'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $setup = Join-Path $dir 'DMTPRO_Setup_2.0.3_win_x64.exe'
          $url = 'https://github.com/hsynbkr-bit/DMTPRO-Updates/releases/download/dmtpro-v2.0.3/DMTPRO_Setup_2.0.3_win_x64.exe'
          Invoke-WebRequest $url -OutFile $setup -TimeoutSec 180
          $actual = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '98008f6617edeb9b15305e2d04d1cde424e46276a2d71388bb16984c3c60e655'
          if ($actual -ne $expected) { throw 'Published release checksum does not match immutable expected SHA-256' }

          $extracted = Join-Path $dir 'extracted'
          & 'C:\Program Files\7-Zip\7z.exe' x -y "-o$extracted" $setup | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract setup for Authenticode inspection' }
          $paths = @(
            [pscustomobject]@{Name='Setup.exe';Path=$setup},
            [pscustomobject]@{Name='DMTPROLauncher.exe';Path=(Join-Path $extracted 'DMTPROLauncher.exe')},
            [pscustomobject]@{Name='DMTPRO.exe';Path=(Join-Path $extracted 'DMTPRO.exe')}
          )
          $report = @()
          foreach ($item in $paths) {
            if (!(Test-Path $item.Path)) { throw "Missing embedded PE file: $($item.Name)" }
            $sig = Get-AuthenticodeSignature -FilePath $item.Path
            $report += [pscustomobject]@{
              Component=$item.Name
              SignatureStatus=[string]$sig.Status
              Publisher=if ($sig.SignerCertificate) {$sig.SignerCertificate.Subject} else {'<none>'}
              TimeStamp=if ($sig.TimeStamperCertificate) {$sig.TimeStamperCertificate.Subject} else {'<none>'}
              SHA256=(Get-FileHash $item.Path -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $report | Format-Table -AutoSize | Out-String | Write-Host
          $json = $report | ConvertTo-Json -Depth 3
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## DMTPRO 2.0.3 Authenticode status"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "```json"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $json
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "```"
          Write-Host 'AUDIT_COMPLETED: no executable launched; signature statuses shown above'
